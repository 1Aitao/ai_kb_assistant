<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://registry.npmmirror.com/marked/12.0.2/files/lib/marked.umd.js"></script>
    <title>个人知识库 AI 助手</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 300px;
            background: #f5f5f5;
            padding: 20px;
            border-right: 1px solid #ddd;
        }
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        .input-area {
            padding: 20px;
            border-top: 1px solid #ddd;
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
        }
        button {
            padding: 10px 20px;
            cursor: pointer;
        }
        /* 文档列表项：标题和删除按钮横向排列 */
        .doc-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .doc-title {
            cursor: pointer;
            color: #0066cc;
            flex: 1;
        }
        /* 删除按钮：小号红色 */
        .delete-btn {
            padding: 2px 8px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 12px;
        }
        .delete-btn:hover {
            background: #c0392b;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>知识库</h2>
        <input type="file" id="fileInput">
        <button onclick="uploadFile()">上传文件</button>
        <h3>文档列表</h3>
        <p style="font-size: 12px; color: gray;">点击文档标题可快速提问</p>
        <ul id="documentList"></ul>
    </div>
    <div class="main">
        <div class="chat-box" id="chatBox">
            <p>欢迎来到个人知识库 AI 助手</p>
        </div>
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="输入你的问题">
            <button onclick="sendMessage()">发送</button>
        </div>
    </div>

    <script>
        let chatHistory = [];
        
        async function uploadFile() {
            const fileInput = document.getElementById("fileInput");
            const file = fileInput.files[0];

            if (!file) {
                alert("请先选择一个文件");
                return;
            }

            const formData = new FormData();
            formData.append("file", file);

            try {
                const response = await fetch("/upload", {
                    method: "POST",
                    body: formData
                });

                const result = await response.json();
                // 成功时后端返回 message，失败时返回 detail；都取不到再兜底
                alert(result.message || result.detail || "未知响应");
                loadDocuments();
            } catch (error) {
                alert("上传失败：" + error);
            }
        }

        async function sendMessage() {
            const messageInput = document.getElementById("messageInput");
            const message = messageInput.value.trim();

            if (!message) {
                alert("请输入问题");
                return;
            }

            const chatBox = document.getElementById("chatBox");

            // 1. 显示用户消息
    const userP = document.createElement("p");
    userP.innerHTML = "<strong>你：</strong>" + message;
    chatBox.appendChild(userP);

    // 2. 把用户消息加入历史
    chatHistory.push({
        role: "user",
        content: message
    });

    try {
        // 3. 发请求给后端，带上历史记录
        const response = await fetch("/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: message,
                history: chatHistory
            })
        });

        const result = await response.json();

        // 4. 显示 AI 回复
        let reply = "AI 没有回复";
        if (result && result.reply) {
            reply = result.reply;
        }

        const aiP = document.createElement("p");
        // 用 marked 渲染 Markdown；若 CDN 加载失败则降级为纯文本，避免整轮对话崩掉
        function renderMarkdown(text) {
            if (typeof marked !== "undefined") {
                return marked.parse(text);
            }
            return text.replace(/\n/g, "<br>");
        }

        aiP.innerHTML = "<strong>AI:</strong>" + renderMarkdown(reply);
        chatBox.appendChild(aiP);

        // 5. 把 AI 回复也加入历史
        chatHistory.push({
            role: "assistant",
            content: reply
        });

        // 6. 限制历史长度，避免 token 太多
        if (chatHistory.length > 10) {
            chatHistory = chatHistory.slice(chatHistory.length - 10);
        }


                messageInput.value = "";
            } catch (error) {
                alert("发送失败：" + error);
            }
        }

        async function loadDocuments() {
            try {
                const response = await fetch("/documents");
                const documents = await response.json();

                const list = document.getElementById("documentList");
                list.innerHTML = "";

                for (const doc of documents) {
                    const li = document.createElement("li");
                    li.className = "doc-item";

                    // 文档标题：点击可快速提问
                    const titleSpan = document.createElement("span");
                    titleSpan.className = "doc-title";
                    titleSpan.textContent = doc.title;
                    titleSpan.onclick = function() {
                        const messageInput = document.getElementById("messageInput");
                        messageInput.value = "请根据文档《" + doc.title + "》回答我的问题：";
                        messageInput.focus();
                    };

                    // 删除按钮：点击删除该文档（同时删除 SQLite 和向量库数据）
                    const deleteBtn = document.createElement("button");
                    deleteBtn.className = "delete-btn";
                    deleteBtn.textContent = "删除";
                    deleteBtn.onclick = function() {
                        deleteDocument(doc.id, doc.title);
                    };

                    li.appendChild(titleSpan);
                    li.appendChild(deleteBtn);
                    list.appendChild(li);
                }
            } catch (error) {
                console.log("加载文档失败：" + error);
            }
        }

        async function deleteDocument(docId, docTitle) {
            // 二次确认，防止误删
            if (!confirm("确定要删除文档《" + docTitle + "》吗？删除后无法恢复。")) {
                return;
            }

            try {
                const response = await fetch("/documents/" + docId, {
                    method: "DELETE"
                });

                if (response.ok) {
                    alert("删除成功");
                    loadDocuments();  // 重新加载文档列表
                } else {
                    const error = await response.json();
                    alert("删除失败：" + (error.detail || "未知错误"));
                }
            } catch (error) {
                alert("删除失败：" + error);
            }
        }

        // 回车键发送：在输入框按下回车（且不是输入法选字状态）就触发发送
        const messageInput = document.getElementById("messageInput");
        messageInput.addEventListener("keydown", function(event) {
            // event.isComposing 为 true 表示正在用输入法拼音选字，此时回车是确认汉字，不应发送
            if (event.key === "Enter" && !event.isComposing) {
                event.preventDefault();  // 阻止回车默认行为（如表单提交）
                sendMessage();
            }
        });

        loadDocuments();
    </script>
</body>
</html>
