<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <title>个人知识库 AI 助手</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 300px;
            background: #f5f5f5;
            padding: 20px;
            border-right: 1px solid #ddd;
        }
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        .input-area {
            padding: 20px;
            border-top: 1px solid #ddd;
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
        }
        button {
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>知识库</h2>
        <input type="file" id="fileInput">
        <button onclick="uploadFile()">上传文件</button>
        <h3>文档列表</h3>
        <p style="font-size: 12px; color: gray;">点击文档标题可快速提问</p>
        <ul id="documentList"></ul>
    </div>
    <div class="main">
        <div class="chat-box" id="chatBox">
            <p>欢迎来到个人知识库 AI 助手</p>
        </div>
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="输入你的问题">
            <button onclick="sendMessage()">发送</button>
        </div>
    </div>

    <script>
        async function uploadFile() {
            const fileInput = document.getElementById("fileInput");
            const file = fileInput.files[0];

            if (!file) {
                alert("请先选择一个文件");
                return;
            }

            const formData = new FormData();
            formData.append("file", file);

            try {
                const response = await fetch("/upload", {
                    method: "POST",
                    body: formData
                });

                const result = await response.json();
                alert(result.message);
                loadDocuments();
            } catch (error) {
                alert("上传失败：" + error);
            }
        }

        async function sendMessage() {
            const messageInput = document.getElementById("messageInput");
            const message = messageInput.value.trim();

            if (!message) {
                alert("请输入问题");
                return;
            }

            const chatBox = document.getElementById("chatBox");

            const userP = document.createElement("p");
            userP.innerHTML = "<strong>你：</strong>" + message;
            chatBox.appendChild(userP);

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ message: message })
                });

                const result = await response.json();

                const aiP = document.createElement("p");
                aiP.innerHTML = "<strong>AI:</strong>" + marked.parse(result.reply);
                chatBox.appendChild(aiP);

                messageInput.value = "";
            } catch (error) {
                alert("发送失败：" + error);
            }
        }

        async function loadDocuments() {
            try {
                const response = await fetch("/documents");
                const documents = await response.json();

                const list = document.getElementById("documentList");
                list.innerHTML = "";

                for (const doc of documents) {
                    const li = document.createElement("li");
                    li.textContent = doc.title;
                    li.style.cursor = "pointer";
                    li.style.color = "#0066cc";
                    li.style.marginBottom = "5px";
                    li.onclick = function() {
                        const messageInput = document.getElementById("messageInput");
                        messageInput.value = "请根据文档《" + doc.title + "》回答我的问题：";
                        messageInput.focus();
                    };
                    list.appendChild(li);
                }
            } catch (error) {
                console.log("加载文档失败：" + error);
            }
        }

        loadDocuments();
    </script>
</body>
</html>
